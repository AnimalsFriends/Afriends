# =====================================================================
# CI/CD de Animal Friends
#   - En cada Pull Request y en cada push a main: build, auditoría y pruebas.
#   - Solo un push a main o una ejecución manual en main puede desplegar producción.
# Configuración necesaria: ver GUIA_FASE4_CONFIGURACION.md (sección 5).
# =====================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, auditoría y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, empaquetado, auditoría y pruebas
        run: npm run check

  deploy:
    name: Desplegar a Cloudflare Workers
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir y empaquetar (dist/)
        run: npm run build
      - name: Validar URL del Worker y Site Key de producción
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.SITE_URL != '' }}
        run: |
          node --input-type=module -e '
            import { ENV } from "./src/config/env.js";
            const site = new URL(process.env.SITE_URL);
            if (site.protocol !== "https:" || site.hostname !== "afriends.petcommunity-133.workers.dev" || site.pathname !== "/") {
              console.error("SITE_URL debe coincidir con la URL workers.dev confirmada, sin rutas.");
              process.exit(1);
            }
            const testKeys = new Set(["1x0000000000000000000000000000000AA", "1x00000000000000000000AA"]);
            if (!ENV.TURNSTILE_SITE_KEY || testKeys.has(ENV.TURNSTILE_SITE_KEY)) {
              console.error("Reemplaza TURNSTILE_SITE_KEY por la Site key real antes de desplegar.");
              process.exit(1);
            }
          '
      - name: Publicar Worker de producción
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.SITE_URL != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Aviso si faltan credenciales
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.SITE_URL == '' }}
        run: echo "::warning::Despliegue omitido. Configura CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID como secretos, y SITE_URL como variable (ver GUIA_FASE4_CONFIGURACION.md)."
